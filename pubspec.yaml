name: bilihub
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Barcode and QR code scanner
  mobile_scanner: ^7.4.2

  # Interactive map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/bilihub_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/bilihub_app_icon.png
  adaptive_icon_background: "#241458"
  adaptive_icon_foreground: assets/bilihub_app_icon.png
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  background_color_ios: "#241458"
  web:
    generate: true
    image_path: assets/bilihub_app_icon.png
    background_color: "#241458"
    theme_color: "#6C4CF1"
  windows:
    generate: true
    image_path: assets/bilihub_app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/bilihub_app_icon.png